name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      # Por ahora solo fallan los errores; los avisos heredados se limpian en M10
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
